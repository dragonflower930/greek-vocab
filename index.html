<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>헬라어 단어장</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gentium+Plus:wght@400;700&display=swap">
<style>
:root{--bg:#f6f7f9;--surface:#ffffff;--ink:#1b2230;--ink2:#566072;--ink3:#8a93a3;--line:#e2e5ea;--line2:#c6ccd6;--accent:#0f5c6e;--accent-bg:#e3f1f4;--ok:#2f6b2f;--ok-bg:#e6f2e4;--star:#b7791f;--hl:#fff4d1;--err:#b3261e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#14181f;--surface:#1b212b;--ink:#e8ebf0;--ink2:#a4adbb;--ink3:#7a8494;--line:#2b3340;--line2:#414b5c;--accent:#7cc4d4;--accent-bg:#1b3a43;--ok:#9bd08f;--ok-bg:#243a22;--star:#e6b450;--hl:#3a3220;--err:#f2a5a0}}
:root[data-theme="dark"]{--bg:#14181f;--surface:#1b212b;--ink:#e8ebf0;--ink2:#a4adbb;--ink3:#7a8494;--line:#2b3340;--line2:#414b5c;--accent:#7cc4d4;--accent-bg:#1b3a43;--ok:#9bd08f;--ok-bg:#243a22;--star:#e6b450;--hl:#3a3220;--err:#f2a5a0}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 150px}
h1{font-size:20px;font-weight:600;margin:0 0 4px}
.sub{font-size:13px;color:var(--ink2);margin:0 0 16px}
h2.sec{font-size:14px;font-weight:500;margin:0 0 8px}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:0 0 8px}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
.stat{font-size:13px;color:var(--ink2);margin:0 0 16px}
.chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:0 0 8px;touch-action:none}
.chip{min-height:48px;padding:4px 2px;font:inherit;font-size:14px;line-height:1.3;color:var(--ink);background:var(--surface);border:1px solid var(--line2);border-radius:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}
.chip small{font-size:11px;color:var(--ink3)}
.chip.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.chip.on small{color:var(--accent)}
.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0 0 16px}
.btn{min-height:44px;padding:0 12px;font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line2);border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--ink3)}
.btn:active,.chip:active{transform:scale(0.98)}
.btn.wide{grid-column:1/-1}
.btn.dim{color:var(--ink3)}
.btn.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.sw{display:grid;grid-template-columns:1fr 1fr 1fr 1.3fr;gap:8px;margin:0 0 16px}
.sw .btn{padding:0 4px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn.danger:hover{background:var(--err);color:var(--bg)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bg);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px))}
.dock .in{max-width:560px;margin:0 auto}
.dock .cap{font-size:12px;line-height:18px;height:18px;color:var(--ink3);margin:0 0 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dock .btns{margin:0}
button:focus-visible,tr:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
table{width:100%;table-layout:fixed;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:8px}
th{text-align:left;font-size:13px;font-weight:500;color:var(--ink2);padding:10px 8px;border-bottom:1px solid var(--line2)}
td{padding:4px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody.quiz tr{cursor:pointer}
td.stc{padding:0}
.st{width:100%;min-height:44px;padding:0;font:inherit;font-size:13px;color:var(--ink3);background:transparent;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.st svg{width:20px;height:20px;color:var(--star)}
tr.hl td{background:var(--hl)}
.gr{font-family:"Gentium Plus","Palatino Linotype","Times New Roman",serif;font-size:21px;line-height:1.35;padding-top:8px;padding-bottom:8px;overflow-wrap:anywhere}
.gw{display:inline;margin:0;padding:0;font:inherit;color:inherit;text-align:left;background:none;border:0;cursor:pointer;text-decoration:underline dotted;text-decoration-color:var(--line2);text-underline-offset:5px;overflow-wrap:anywhere}
.pr{display:block;font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;font-size:13px;line-height:1.3;color:var(--accent);margin-top:2px}
.mn{font-size:15px;overflow-wrap:anywhere}
.mn.hid{color:var(--ink3);font-size:13px}
.ck{width:44px;height:44px;padding:0;display:inline-flex;align-items:center;justify-content:center;color:var(--ink2);background:transparent;border:1px solid var(--line2);border-radius:8px;cursor:pointer}
.ck:hover{color:var(--ok);border-color:var(--ok);background:var(--ok-bg)}
.ck svg{width:20px;height:20px}
.center{text-align:center}
.right{text-align:right}
.msg{display:none;margin:0 0 16px;padding:20px 16px;text-align:center;font-size:15px;border-radius:8px}
.msg.done{color:var(--ok);background:var(--ok-bg)}
.msg.empty{color:var(--ink2);background:var(--surface);border:1px solid var(--line)}
.memh{font-size:14px;font-weight:500;margin:28px 0 8px}
.memw{font-family:"Gentium Plus","Palatino Linotype","Times New Roman",serif;font-size:18px;overflow-wrap:anywhere}
.memm{font-size:13px;color:var(--ink2);overflow-wrap:anywhere}
.undo{min-height:44px;padding:0 10px;font:inherit;font-size:13px;color:var(--accent);background:transparent;border:0;cursor:pointer}
.note{font-size:12px;color:var(--ink3);margin:20px 0 0}
#starPage{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#q{display:block;width:100%;min-height:44px;padding:8px 12px;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line2);border-radius:8px}
#q:focus{outline:2px solid var(--accent);outline-offset:1px}
.qmsg{font-size:13px;color:var(--ink2);margin:8px 0 0}
.qm{font-size:15px;overflow-wrap:anywhere}
.st.q{flex-direction:column;gap:1px;line-height:1.2}
.st.q svg{width:16px;height:16px}
.ql{font-size:12px;color:var(--ink2)}
.ck.on{color:var(--ok);border-color:var(--ok);background:var(--ok-bg)}
.typing .dock{display:none}
.starmode .dock{display:none}
#scrollToggle{position:fixed;left:16px;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:11;width:44px;height:44px;padding:0;display:flex;align-items:center;justify-content:center;color:var(--ink2);background:var(--surface);border:1px solid var(--line2);border-radius:999px;box-shadow:0 1px 4px rgba(0,0,0,.15);cursor:pointer}
#scrollToggle svg{width:20px;height:20px}
.typing #scrollToggle,.starmode #scrollToggle{display:none}
@media (min-width:860px){
.wrap{max-width:680px;padding:40px 32px 60px}
h1{font-size:26px}
.sub{font-size:14px}
h2.sec{font-size:15px}
.chips{grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.chip{min-height:36px;font-size:13px}
.chip small{font-size:10px}
.btn{min-height:38px;font-size:13px}
.sw{gap:6px}
.gr{font-size:30px;padding-top:14px;padding-bottom:14px}
.mn{font-size:19px}
.mn.hid{font-size:14px}
.pr{font-size:14px}
td{padding:8px 10px}
.ck{width:38px;height:38px}
.ck svg{width:18px;height:18px}
.st{min-height:38px}
.st svg{width:18px;height:18px}
#scrollToggle{display:none}
.dock{position:static;border-top:0;background:transparent;padding:28px 0 0}
.dock .in{max-width:680px;margin:0}
.dock .cap{display:none}
.dock .btns{max-width:280px;margin-left:auto}
}
</style>
<script data-goatcounter="https://greek-vocab.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<main class="wrap">
<h1>헬라어 단어장</h1>
<p class="sub">과를 고른 뒤 뜻 칸을 눌러 확인하고, 외웠으면 오른쪽 체크를 누르세요. 번호를 누르면 별표, 헬라어를 누르면 발음이 표시됩니다. 과 버튼의 숫자는 남은 단어 / 전체 단어입니다.</p>
<h2 class="sec">과 선택</h2>
<div class="chips" id="chips"></div>
<div class="btns">
<button class="btn" id="selAll" type="button">전체 과 선택</button>
<button class="btn" id="selNone" type="button">선택 해제</button>
</div>
<div class="bar" aria-hidden="true"><i id="fill"></i></div>
<p class="stat" id="stat"></p>
<div class="sw">
<button class="btn" id="hardOnly" type="button" aria-pressed="false">★만</button>
<button class="btn" id="hideStars" type="button" aria-pressed="false">별표 숨김</button>
<button class="btn" id="toggleAll" type="button" aria-pressed="false">뜻 열기</button>
<button class="btn pri" id="shuffle" type="button">단어 섞기</button>
</div>
<div class="msg done" id="done">선택한 과의 단어를 모두 외웠습니다.</div>
<div class="msg empty" id="empty">암기할 과를 하나 이상 선택하세요.</div>
<div class="msg empty" id="noStar">선택한 과에 별표한 단어가 남아 있지 않습니다.</div>
<table id="tbl">
<colgroup><col style="width:13%"><col style="width:34%"><col style="width:37%"><col style="width:16%"></colgroup>
<thead><tr><th>#</th><th>헬라어</th><th>뜻</th><th class="center">외움</th></tr></thead>
<tbody class="quiz" id="body"></tbody>
</table>
<button class="btn" id="memToggle2" type="button" style="width:100%;margin:16px 0 0">외운 단어 보기</button>
<section id="memPanel" style="display:none">
<h2 class="memh">외운 단어 (선택한 과)</h2>
<table>
<colgroup><col style="width:12%"><col style="width:33%"><col style="width:33%"><col style="width:22%"></colgroup>
<tbody id="memBody"></tbody>
</table>
</section>
<button class="btn" id="starToggle2" type="button" style="width:100%;margin:16px 0 0">별표 단어장 보기</button>
<button class="btn danger" id="reset" type="button" style="display:block;margin:40px 0 0 auto;padding:0 20px">선택한 과 초기화</button>
<button class="btn" id="moreToggle" type="button" aria-expanded="false" style="width:100%;margin:20px 0 0">더보기</button>
<div class="btns" id="morePanel" style="display:none;margin:8px 0 0">
<button class="btn wide" id="sortNo" type="button">번호순 정렬</button>
<button class="btn wide" id="clearStars" type="button">별표 전체 해제</button>
</div>
<section class="srch" style="margin-top:16px">
<h2 class="memh">단어 검색</h2>
<input id="q" type="search" placeholder="뜻, 한글 발음, 헬라어로 검색" autocomplete="off" autocapitalize="off" aria-label="단어 검색">
<p class="qmsg" id="qMsg" role="status"></p>
<table id="qTbl" style="display:none;margin:8px 0 0">
<colgroup><col style="width:13%"><col style="width:34%"><col style="width:37%"><col style="width:16%"></colgroup>
<thead><tr><th>과</th><th>헬라어</th><th>뜻</th><th class="center">외움</th></tr></thead>
<tbody id="qBody"></tbody>
</table>
</section>
<p class="note" id="note"></p>
</main>
<div id="starPage" style="display:none">
<div class="wrap">
<button class="btn" id="starBack" type="button" style="margin:0 0 16px">← 돌아가기</button>
<h1 style="margin:0 0 4px">별표 단어장</h1>
<p class="sub">과 선택과 무관하게, 외운 단어를 포함해 별표한 모든 단어입니다. 뜻 칸을 누르면 확인됩니다.</p>
<div class="btns">
<button class="btn" id="hideLessonStar" type="button" aria-pressed="false">과 숨김</button>
<button class="btn" id="shuffleStar" type="button">순서 섞기</button>
</div>
<table id="starTbl">
<colgroup><col style="width:12%"><col style="width:30%"><col style="width:35%"><col style="width:23%"></colgroup>
<thead><tr><th>과</th><th>헬라어</th><th>뜻</th><th class="right">-</th></tr></thead>
<tbody id="starBody"></tbody>
</table>
</div>
</div>
<button id="scrollToggle" type="button" aria-label="맨 아래로 이동"></button>
<div class="dock" role="toolbar" aria-label="체크 되돌리기">
<div class="in">
<p class="cap" id="cap"></p>
<div class="btns">
<button class="btn" id="redoLast" type="button">다시 체크</button>
<button class="btn" id="undoLast" type="button">체크 취소</button>
</div>
</div>
</div>

var CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>';
var ARROW_UP='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
var ARROW_DOWN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12l7 7 7-7"/></svg>';
function validNo(v){return typeof v==="number"&&byNo[v]!==undefined;}
function uniq(arr){return arr.filter(function(v,k){return arr.indexOf(v)===k;});}
function load(){
try{
var raw=localStorage.getItem(KEY);
if(raw){
var s=JSON.parse(raw);
if(s&&Array.isArray(s.order)&&s.order.length===data.length&&s.order.every(validNo)&&uniq(s.order).length===data.length){order=s.order;}
if(s&&Array.isArray(s.mem)){mem=new Set(s.mem.filter(validNo));}
if(s&&Array.isArray(s.hist)){hist=uniq(s.hist.filter(function(v){return validNo(v)&&mem.has(v);}));}
if(s&&Array.isArray(s.sel)){sel=new Set(s.sel.filter(function(l){return lessons.indexOf(l)>=0;}));}
if(s&&Array.isArray(s.stars)){stars=new Set(s.stars.filter(validNo));}
if(s&&Array.isArray(s.starOrder)&&s.starOrder.length===data.length&&s.starOrder.every(validNo)&&uniq(s.starOrder).length===data.length){starOrder=s.starOrder;}
hardOnly=!!(s&&s.hardOnly===true);
hideStars=!!(s&&s.hideStars===true);
hideLessonStar=!!(s&&s.hideLessonStar===true);
return;
}
var oldRaw=localStorage.getItem(OLD_KEY);
if(oldRaw){
var o=JSON.parse(oldRaw);
var toNo=function(idx){
if(typeof idx!=="number"||!OLD_WORDS[idx])return null;
var g=OLD_WORDS[idx];
for(var k=0;k<data.length;k++){if(data[k][1]>=6&&data[k][1]<=7&&data[k][2]===g)return data[k][0];}
return null;
};
if(Array.isArray(o.mem)){mem=new Set(o.mem.map(toNo).filter(function(v){return v!==null;}));}
var oh=Array.isArray(o.hist)?o.hist:(typeof o.last==="number"?[o.last]:[]);
hist=uniq(oh.map(toNo).filter(function(v){return v!==null&&mem.has(v);}));
sel=new Set([6,7]);
}
}catch(e){}
}
function save(){
try{
localStorage.setItem(KEY,JSON.stringify({order:order,mem:Array.from(mem),hist:hist,sel:Array.from(sel),stars:Array.from(stars),hardOnly:hardOnly,hideStars:hideStars,starOrder:starOrder,hideLessonStar:hideLessonStar}));
}catch(e){canSave=false;}
}
function inSel(no){return sel.has(byNo[no][1]);}
function base(){return order.filter(function(no){return inSel(no)&&!mem.has(no);});}
function active(){var b=base();return hardOnly?b.filter(function(no){return stars.has(no)||!!flash[no];}):b;}
function hlOn(no){return hideStars?!!(flash[no]&&flash[no].on):stars.has(no);}
var STAR=function(on){return '<svg viewBox="0 0 24 24" fill="'+(on?'currentColor':'none')+'" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.8 6.8 19.6l1-5.8L3.5 9.7l5.9-.9z"/></svg>';};
function starCell(no,n){
if(hideStars){
if(n===null)return '';
var f=flash[no];
return '<button class="st" type="button" data-star="'+no+'" aria-label="어려운 단어 표시 변경">'+(f?STAR(f.on):n)+'</button>';
}
var on=stars.has(no);
return '<button class="st" type="button" data-star="'+no+'" aria-pressed="'+(on?'true':'false')+'" aria-label="어려운 단어 표시">'+(on?STAR(true):(n===null?STAR(false):n))+'</button>';
}
var body=document.getElementById("body");
var memBody=document.getElementById("memBody");
var chips=document.getElementById("chips");
var btnAll=document.getElementById("toggleAll");
var btnMem=document.getElementById("memToggle2");
var btnUndo=document.getElementById("undoLast");
var btnRedo=document.getElementById("redoLast");
var btnMore=document.getElementById("moreToggle");
var morePanel=document.getElementById("morePanel");
var btnStar=document.getElementById("starToggle2");
var starBody=document.getElementById("starBody");
var btnHideLS=document.getElementById("hideLessonStar");
var btnShuffleStar=document.getElementById("shuffleStar");
var btnHard=document.getElementById("hardOnly");
var btnClear=document.getElementById("clearStars");
var btnHide=document.getElementById("hideStars");
function render(){
var tot={},rem={};
lessons.forEach(function(l){tot[l]=0;rem[l]=0;});
data.forEach(function(d){tot[d[1]]++;if(!mem.has(d[0]))rem[d[1]]++;});
chips.innerHTML=lessons.map(function(l){
var on=sel.has(l);
var sm=rem[l]===0?"완료":rem[l]+"/"+tot[l];
return '<button class="chip'+(on?' on':'')+'" type="button" data-l="'+l+'" aria-pressed="'+(on?'true':'false')+'">'+l+'과<small>'+sm+'</small></button>';
}).join("");
var act=active();
var T=0,M=0;
data.forEach(function(d){if(sel.has(d[1])){T++;if(mem.has(d[0]))M++;}});
body.innerHTML=act.map(function(no,n){
var d=byNo[no];
var open=shown.has(no);
return '<tr data-i="'+no+'" tabindex="0"'+(hlOn(no)?' class="hl"':'')+'>'+
'<td class="stc">'+starCell(no,n+1)+'</td>'+
'<td class="gr"><button class="gw" type="button">'+d[2]+'</button>'+(pron.has(no)?'<span class="pr">'+d[4]+'</span>':'')+'</td>'+
'<td class="mn'+(open?'':' hid')+'">'+(open?d[3]:'탭하여 보기')+'</td>'+
'<td class="center"><button class="ck" type="button" data-mem="'+no+'" aria-label="외웠음으로 표시">'+CHECK+'</button></td></tr>';
}).join("");
var none=sel.size===0;
var bs=base();
var allDone=!none&&bs.length===0;
var noStar=!none&&!allDone&&act.length===0;
var starSel=0;
data.forEach(function(d){if(sel.has(d[1])&&stars.has(d[0]))starSel++;});
document.getElementById("tbl").style.display=act.length?"table":"none";
document.getElementById("done").style.display=allDone?"block":"none";
document.getElementById("empty").style.display=none?"block":"none";
document.getElementById("noStar").style.display=noStar?"block":"none";
document.getElementById("fill").style.width=(T?Math.round(M/T*100):0)+"%";
document.getElementById("stat").textContent=none?"선택한 과 없음":"선택한 과 "+sel.size+"개 · 남은 단어 "+bs.length+" · 외운 단어 "+M+" / "+T+" · 별표 "+starSel+(hardOnly?" · 어려운 단어만 "+act.length+"개 표시 중":"");
var starRem=bs.filter(function(no){return stars.has(no);}).length;
btnHard.textContent="★만 ("+starRem+")";
btnHard.className=hardOnly?"btn on":"btn";
btnHard.setAttribute("aria-pressed",hardOnly?"true":"false");
btnHide.textContent="별표 숨김";
btnHide.className=hideStars?"btn on":"btn";
btnHide.setAttribute("aria-pressed",hideStars?"true":"false");
var allShown=act.length>0&&act.every(function(no){return shown.has(no);});
btnAll.textContent="뜻 열기";
btnAll.className=allShown?"btn on":"btn";
btnAll.setAttribute("aria-pressed",allShown?"true":"false");
btnUndo.textContent=hist.length?"체크 취소 ("+hist.length+")":"체크 취소";
btnUndo.className=hist.length?"btn":"btn dim";
btnRedo.textContent=redo.length?"다시 체크 ("+redo.length+")":"다시 체크";
btnRedo.className=redo.length?"btn":"btn dim";
document.getElementById("cap").textContent=hist.length?"취소 대상: "+byNo[hist[hist.length-1]][2]:"취소할 체크가 없습니다";
btnMore.textContent=moreOpen?"더보기 닫기":"더보기";
btnMore.setAttribute("aria-expanded",moreOpen?"true":"false");
morePanel.style.display=moreOpen?"grid":"none";
var list=order.filter(function(no){return mem.has(no)&&inSel(no);});
if(hardOnly)list=list.filter(function(no){return stars.has(no)||!!flash[no];});
btnMem.textContent=memOpen?"외운 단어 닫기":"외운 단어 보기 ("+list.length+")";
document.getElementById("memPanel").style.display=memOpen?"block":"none";
memBody.innerHTML=list.length?list.map(function(no){
var d=byNo[no];
return '<tr'+(hlOn(no)?' class="hl"':'')+'><td class="stc">'+starCell(no,null)+'</td><td class="memw"><button class="gw" type="button" data-no="'+no+'">'+d[2]+'</button>'+(pron.has(no)?'<span class="pr">'+d[4]+'</span>':'')+'</td><td class="memm">'+d[3]+'</td>'+
'<td class="right"><button class="undo" type="button" data-undo="'+no+'">되돌리기</button></td></tr>';
}).join(""):'<tr><td colspan="4" class="memm" style="padding:12px 8px">'+(hardOnly?"별표한 외운 단어가 없습니다.":"아직 없습니다.")+'</td></tr>';
var starList=starOrder.filter(function(no){return stars.has(no);});
btnStar.textContent="별표 단어장 보기 ("+starList.length+")";
document.getElementById("starPage").style.display=starOpen?"block":"none";
document.body.classList.toggle("starmode",starOpen);
btnHideLS.textContent="과 숨김";
btnHideLS.className=hideLessonStar?"btn on":"btn";
btnHideLS.setAttribute("aria-pressed",hideLessonStar?"true":"false");
starBody.innerHTML=starList.length?starList.map(function(no){
var d=byNo[no];
var open=shown.has(no);
return '<tr data-i="'+no+'"><td class="center">'+(hideLessonStar?'':d[1]+'과')+'</td><td class="memw"><button class="gw" type="button" data-no="'+no+'">'+d[2]+'</button>'+(pron.has(no)?'<span class="pr">'+d[4]+'</span>':'')+'</td><td class="mn'+(open?'':' hid')+'">'+(open?d[3]:'탭하여 보기')+'</td>'+
'<td class="right">'+(mem.has(no)?'<span class="memm">외움</span><br>':'')+'<button class="undo" type="button" data-unstar="'+no+'">별표 해제</button></td></tr>';
}).join(""):'<tr><td colspan="4" class="memm" style="padding:12px 8px">별표한 단어가 없습니다.</td></tr>';
runSearch();
document.getElementById("note").textContent=(canSave?"진행 상태와 선택한 과는 이 기기의 이 브라우저에 자동 저장됩니다.":"이 브라우저에서는 진행 상태를 저장할 수 없습니다. 페이지를 닫으면 초기화됩니다.")+" ("+VERSION+")";
}
function toggleRow(tr){
var no=Number(tr.getAttribute("data-i"));
if(shown.has(no))shown.delete(no);else shown.add(no);
render();
}
var chipDrag=false;
var chipDragTarget=null;
var chipOrigSel=null;
var chipStartIdx=null;
function chipApplyRange(idx){
var lo=Math.min(chipStartIdx,idx),hi=Math.max(chipStartIdx,idx);
lessons.forEach(function(l,i){
if(i>=lo&&i<=hi){if(chipDragTarget)sel.add(l);else sel.delete(l);}
else{if(chipOrigSel.has(l))sel.add(l);else sel.delete(l);}
});
save();
render();
}
chips.addEventListener("pointerdown",function(e){
var c=e.target.closest("[data-l]");
if(!c)return;
chipDrag=true;
chipOrigSel=new Set(sel);
var l=Number(c.getAttribute("data-l"));
chipStartIdx=lessons.indexOf(l);
chipDragTarget=!sel.has(l);
chipApplyRange(chipStartIdx);
try{chips.setPointerCapture(e.pointerId);}catch(err){}
});
chips.addEventListener("pointermove",function(e){
if(!chipDrag)return;
var el=document.elementFromPoint(e.clientX,e.clientY);
var c=el&&el.closest?el.closest("[data-l]"):null;
if(!c)return;
var idx=lessons.indexOf(Number(c.getAttribute("data-l")));
if(idx<0)return;
chipApplyRange(idx);
});
function chipEndDrag(){chipDrag=false;}
chips.addEventListener("pointerup",chipEndDrag);
chips.addEventListener("pointercancel",chipEndDrag);
document.getElementById("selAll").addEventListener("click",function(){sel=new Set(lessons);save();render();});
document.getElementById("selNone").addEventListener("click",function(){sel=new Set();save();render();});
function toggleStar(no){
if(stars.has(no))stars.delete(no);else stars.add(no);
if(hideStars){
flash[no]={on:stars.has(no)};
clearTimeout(flashT[no]);
flashT[no]=setTimeout(function(){delete flash[no];render();},1200);
}
save();
render();
}
body.addEventListener("click",function(e){
var sb=e.target.closest("[data-star]");
if(sb){toggleStar(Number(sb.getAttribute("data-star")));return;}
var g=e.target.closest(".gr");
if(g){
var gno=Number(g.parentNode.getAttribute("data-i"));
if(pron.has(gno))pron.delete(gno);else pron.add(gno);
render();
return;
}
var m=e.target.closest("[data-mem]");
if(m){
var no=Number(m.getAttribute("data-mem"));
mem.add(no);
hist.push(no);
redo=[];
shown.delete(no);
save();
render();
return;
}
var tr=e.target.closest("tr");
if(tr)toggleRow(tr);
});
body.addEventListener("keydown",function(e){
if(e.target.tagName!=="TR")return;
if(e.key==="Enter"||e.key===" "){e.preventDefault();toggleRow(e.target);}
});
memBody.addEventListener("click",function(e){
var mg=e.target.closest(".memw");
if(mg){
var mno=Number(mg.querySelector("[data-no]").getAttribute("data-no"));
if(pron.has(mno))pron.delete(mno);else pron.add(mno);
render();
return;
}
var sb=e.target.closest("[data-star]");
if(sb){toggleStar(Number(sb.getAttribute("data-star")));return;}
var u=e.target.closest("[data-undo]");
if(!u)return;
var ui=Number(u.getAttribute("data-undo"));
mem.delete(ui);
hist=hist.filter(function(v){return v!==ui;});
redo=[];
save();
render();
});
btnUndo.addEventListener("click",function(){
if(!hist.length)return;
var no=hist.pop();
mem.delete(no);
redo.push(no);
sel.add(byNo[no][1]);
save();
render();
});
btnRedo.addEventListener("click",function(){
if(!redo.length)return;
var no=redo.pop();
if(!mem.has(no)){
mem.add(no);
hist.push(no);
shown.delete(no);
}
save();
render();
});
btnMore.addEventListener("click",function(){moreOpen=!moreOpen;render();});
btnStar.addEventListener("click",function(){starOpen=true;render();window.scrollTo(0,0);});
document.getElementById("starBack").addEventListener("click",function(){starOpen=false;render();});
btnHideLS.addEventListener("click",function(){hideLessonStar=!hideLessonStar;save();render();});
btnShuffleStar.addEventListener("click",function(){
for(var i=starOrder.length-1;i>0;i--){
var j=Math.floor(Math.random()*(i+1));
var t=starOrder[i];starOrder[i]=starOrder[j];starOrder[j]=t;
}
save();
render();
});
starBody.addEventListener("click",function(e){
var mg=e.target.closest(".memw");
if(mg){
var mno=Number(mg.querySelector("[data-no]").getAttribute("data-no"));
if(pron.has(mno))pron.delete(mno);else pron.add(mno);
render();
return;
}
var u=e.target.closest("[data-unstar]");
if(u){
var uno=Number(u.getAttribute("data-unstar"));
stars.delete(uno);
save();
render();
return;
}
var tr=e.target.closest("tr[data-i]");
if(tr){
var tno=Number(tr.getAttribute("data-i"));
if(shown.has(tno))shown.delete(tno);else shown.add(tno);
render();
return;
}
});
btnAll.addEventListener("click",function(){
var act=active();
var allShown=act.length>0&&act.every(function(no){return shown.has(no);});
act.forEach(function(no){if(allShown)shown.delete(no);else shown.add(no);});
render();
});
document.getElementById("shuffle").addEventListener("click",function(){
for(var i=order.length-1;i>0;i--){
var j=Math.floor(Math.random()*(i+1));
var t=order[i];order[i]=order[j];order[j]=t;
}
shown=new Set();
pron=new Set();
save();
render();
});
document.getElementById("sortNo").addEventListener("click",function(){
order=data.map(function(d){return d[0];});
shown=new Set();
save();
render();
});
btnMem.addEventListener("click",function(){memOpen=!memOpen;render();});
btnHard.addEventListener("click",function(){hardOnly=!hardOnly;shown=new Set();save();render();});
btnHide.addEventListener("click",function(){hideStars=!hideStars;flash={};save();render();});
var clearArmed=false;
var clearTimer=null;
function clearLabel(){btnClear.textContent="별표 전체 해제";}
btnClear.addEventListener("click",function(){
if(stars.size>0&&!clearArmed){
clearArmed=true;
btnClear.textContent="한 번 더 누르면 해제";
clearTimeout(clearTimer);
clearTimer=setTimeout(function(){clearArmed=false;clearLabel();},3000);
return;
}
clearTimeout(clearTimer);
clearArmed=false;
clearLabel();
stars=new Set();
save();
render();
});
var btnReset=document.getElementById("reset");
var resetArmed=false;
var resetTimer=null;
function resetLabel(){btnReset.textContent="선택한 과 초기화";}
btnReset.addEventListener("click",function(){
var has=order.some(function(no){return mem.has(no)&&inSel(no);});
if(has&&!resetArmed){
resetArmed=true;
btnReset.textContent="한 번 더 누르면 선택한 과 초기화";
clearTimeout(resetTimer);
resetTimer=setTimeout(function(){resetArmed=false;resetLabel();},3000);
return;
}
clearTimeout(resetTimer);
resetArmed=false;
resetLabel();
order.forEach(function(no){if(inSel(no)){mem.delete(no);shown.delete(no);}});
hist=hist.filter(function(v){return mem.has(v);});
redo=[];
save();
render();
});
var qInput=document.getElementById("q");
var qBody=document.getElementById("qBody");
var qTbl=document.getElementById("qTbl");
var qMsg=document.getElementById("qMsg");
function normK(s){return String(s).toLowerCase().replace(/\s+/g,"");}
function foldG(s){return String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/ς/g,"σ").replace(/\s+/g,"");}
data.forEach(function(d){d.km=normK(d[3]);d.kp=normK(d[4]);d.g=foldG(d[2]);});
function runSearch(){
var raw=qInput.value.trim();
if(!raw){qBody.innerHTML="";qTbl.style.display="none";qMsg.textContent="";return;}
var qk=normK(raw);
var qg=foldG(raw);
var res=data.filter(function(d){return d.km.indexOf(qk)>=0||d.kp.indexOf(qk)>=0||(qg&&d.g.indexOf(qg)>=0);});
var LIM=50;
var show=res.slice(0,LIM);
qBody.innerHTML=show.map(function(d){
var no=d[0];
var f=flash[no];
var icon=hideStars?(f?STAR(f.on):''):(stars.has(no)?STAR(true):'');
var pressed=hideStars?'':' aria-pressed="'+(stars.has(no)?'true':'false')+'"';
var isMem=mem.has(no);
return '<tr'+(hlOn(no)?' class="hl"':'')+'>'+
'<td class="stc"><button class="st q" type="button" data-star="'+no+'"'+pressed+' aria-label="어려운 단어 표시 변경">'+icon+'<span class="ql">'+d[1]+'과</span></button></td>'+
'<td class="memw">'+d[2]+'<span class="pr">'+d[4]+'</span></td>'+
'<td class="qm">'+d[3]+'</td>'+
'<td class="center"><button class="ck'+(isMem?' on':'')+'" type="button" data-qmem="'+no+'" aria-pressed="'+(isMem?'true':'false')+'" aria-label="외움 표시 변경">'+CHECK+'</button></td></tr>';
}).join("");
qTbl.style.display=show.length?"table":"none";
qMsg.textContent=res.length===0?"검색 결과가 없습니다.":(res.length>LIM?res.length+"개 중 "+LIM+"개 표시 중입니다. 더 구체적으로 검색해 보세요.":res.length+"개 결과");
}
qBody.addEventListener("click",function(e){
var sb=e.target.closest("[data-star]");
if(sb){toggleStar(Number(sb.getAttribute("data-star")));return;}
var mb=e.target.closest("[data-qmem]");
if(mb){
var no=Number(mb.getAttribute("data-qmem"));
if(mem.has(no)){
mem.delete(no);
hist=hist.filter(function(v){return v!==no;});
}else{
mem.add(no);
hist.push(no);
shown.delete(no);
}
redo=[];
save();
render();
}
});
qInput.addEventListener("input",runSearch);
qInput.addEventListener("focus",function(){document.body.classList.add("typing");});
qInput.addEventListener("blur",function(){document.body.classList.remove("typing");});
var btnScroll=document.getElementById("scrollToggle");
function updateScrollBtn(){
var atBottom=(window.innerHeight+window.scrollY)>=(document.documentElement.scrollHeight-40);
btnScroll.innerHTML=atBottom?ARROW_UP:ARROW_DOWN;
btnScroll.setAttribute("aria-label",atBottom?"맨 위로 이동":"맨 아래로 이동");
}
btnScroll.addEventListener("click",function(){
var atBottom=(window.innerHeight+window.scrollY)>=(document.documentElement.scrollHeight-40);
window.scrollTo({top:atBottom?0:document.documentElement.scrollHeight,behavior:"smooth"});
});
window.addEventListener("scroll",updateScrollBtn,{passive:true});
load();
render();
updateScrollBtn();
</script>
</body>
</html>
